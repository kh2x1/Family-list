# نشر تطبيق قائمة المشتريات على GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/family-shopping-supabase-CzT5d
  # يسمح بالتشغيل اليدوي من تبويب Actions
  workflow_dispatch:

# صلاحيات لازمة لنشر صفحات GitHub
permissions:
  contents: read
  pages: write
  id-token: write

# نسمح بنشر واحد فقط في كل مرة
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت الاعتمادات
        run: npm ci

      - name: بناء المشروع
        env:
          # تُقرأ من Settings → Secrets and variables → Actions
          # (المفتاح anon عام وآمن للاستخدام في الواجهة)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: إعداد GitHub Pages
        uses: actions/configure-pages@v5

      - name: رفع ملفات النشر
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: النشر إلى GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
